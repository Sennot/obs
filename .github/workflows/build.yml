name: Build ClickSync

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-tests --parallel
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  build:
    name: Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickSync.geode
          path: ${{ steps.build.outputs.build-output }}/*.geode
